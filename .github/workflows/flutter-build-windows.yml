name: Build the windows flutter version of the RustDesk

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "nightly"

permissions:
  contents: write

# NOTE: F-Droid builder script 'flutter/build_fdroid.sh' reads environment
# variables from this workflow!
#
# It does NOT read build steps, however, so please fix 'flutter/build_fdroid.sh
# whenever you add changes to Android CI build action ('build-rustdesk-android')
# in this file!

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2025.08.27
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.4.4"
  NDK_VERSION: "r27c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: Build rustdesk host
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          # Windows: build RustDesk host-only flavor
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack --windows-host
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk-host
          Copy-Item -Force .\rustdesk-host\rustdesk_host_turtlelab.exe .\rustdesk-host\RustDesk.exe

          # Download usbmmidd_v2.zip and extract it to ./rustdesk-host
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2_host.zip
          Expand-Archive usbmmidd_v2_host.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk-host

          # Download printer driver files and extract them to ./rustdesk-host
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4-host.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter-host.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums-host

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums-host -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4-host.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums-host -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter-host.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4-host.zip -DestinationPath .
                mkdir ./rustdesk-host/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk-host/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter-host.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk-host
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: ${{ inputs.upload-artifact }}
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Download RustDeskTempTopMostWindow host artifacts
        uses: actions/download-artifact@master
        if: ${{ inputs.upload-artifact }}
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk-host"

      - name: Upload unsigned
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
          path: rustdesk

      - name: Upload unsigned host
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-host-unsigned-windows-${{ matrix.job.arch }}
          path: rustdesk-host

      - name: Sign rustdesk files
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != ''
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ secrets.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

      - name: Sign rustdesk host files
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != ''
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ secrets.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk-host/

      - name: Build and sign sparse MSIX identity packages
        if: env.UPLOAD_ARTIFACT == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          IDENTITY_PFX_BASE64: ${{ secrets.WINDOWS_IDENTITY_PFX_BASE64 }}
          IDENTITY_PFX_PASSWORD: ${{ secrets.WINDOWS_IDENTITY_PFX_PASSWORD }}
          IDENTITY_WEB_HOST: ${{ vars.WINDOWS_IDENTITY_WEB_HOST }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:IDENTITY_PFX_BASE64 -or -not $env:IDENTITY_PFX_PASSWORD) { Write-Warning "Sparse MSIX signing secrets are missing; continuing without identity package"; exit 0 }
          if ($env:TAG_NAME -notmatch '^v?\d+\.\d+\.\d+(?:[.-]\d+)?$') { Write-Warning "Sparse MSIX requires a release version tag; continuing without identity package"; exit 0 }
          $pfxPath = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.cer"
          $certMarker = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.thumbprint"
          $outputRoot = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-output-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stageRoot = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-stage-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cert = $null; $trustedByStep = $false; $succeeded = $false
          $builds = @(
            @{Dir="rustdesk";Exe="rustdesk.exe";Output=(Join-Path $outputRoot "rustdesk.msix")},
            @{Dir="rustdesk-host";Exe="rustdesk.exe";Output=(Join-Path $outputRoot "rustdesk-host.msix")}
          )
          try {
            Remove-Item $outputRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item $outputRoot -ItemType Directory | Out-Null
            $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName "x64\makeappx.exe")) -and (Test-Path (Join-Path $_.FullName "x64\signtool.exe")) } |
              Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            if (-not $sdk) { throw "Windows SDK MakeAppx and SignTool were not found" }
            $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"; $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:IDENTITY_PFX_BASE64))
            $securePassword = ConvertTo-SecureString $env:IDENTITY_PFX_PASSWORD -AsPlainText -Force
            $cert = (Get-PfxData -FilePath $pfxPath -Password $securePassword).EndEntityCertificates | Select-Object -First 1
            if ($cert.Subject -ne "CN=RustDesk") { throw "Sparse MSIX certificate publisher mismatch" }
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            if (-not (Test-Path "Cert:\CurrentUser\TrustedPeople\$($cert.Thumbprint)")) {
              $trustedByStep = $true
              Set-Content $certMarker $cert.Thumbprint
              Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
            }
            foreach ($build in $builds) {
              Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue; New-Item (Join-Path $stageRoot "Assets") -ItemType Directory | Out-Null
              python res/msix/build_sparse_msix.py --version $env:TAG_NAME --web-host $env:IDENTITY_WEB_HOST --executable $build.Exe --output (Join-Path $stageRoot "AppxManifest.xml")
              Copy-Item res\icon.png (Join-Path $stageRoot "Assets\storelogo.png"); Copy-Item res\icon.png (Join-Path $stageRoot "Assets\Square150x150Logo.png"); Copy-Item res\icon.png (Join-Path $stageRoot "Assets\Square44x44Logo.png")
              & $makeappx pack /o /d $stageRoot /nv /p $build.Output; if ($LASTEXITCODE) { throw "MakeAppx failed" }
              $signed = $false
              foreach ($timestampUrl in @("http://timestamp.digicert.com", "http://timestamp.sectigo.com")) {
                & $signtool sign /fd SHA256 /tr $timestampUrl /td SHA256 /f $pfxPath /p $env:IDENTITY_PFX_PASSWORD $build.Output
                if ($LASTEXITCODE -eq 0) { $signed = $true; break }
              }
              if (-not $signed) { throw "MSIX signing failed" }
              $verifyOutput = (& $signtool verify /pa /all /v $build.Output 2>&1 | Out-String)
              $verifyExitCode = $LASTEXITCODE
              Write-Host $verifyOutput
              $signature = Get-AuthenticodeSignature $build.Output
              $actualThumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { "none" }
              Write-Host "MSIX Authenticode status=$($signature.Status) signer=$actualThumbprint"
              if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "MSIX signer certificate mismatch [$($signature.Status)]" }
              if ([regex]::Matches($verifyOutput, '(?m)^\s*Signature Index:').Count -ne 1) { throw "Unexpected MSIX signature count" }
              if ($verifyOutput -notmatch '(?m)^\s*The signature is timestamped:' -or $verifyOutput -notmatch '(?m)^\s*Timestamp Verified by:') { throw "MSIX RFC3161 timestamp verification failed" }
              $verifyLines = @($verifyOutput -split '\r?\n')
              $rootErrorIndices = @(for ($i = 0; $i -lt $verifyLines.Count; $i++) { if ($verifyLines[$i] -match '^\s*SignTool Error: A certificate chain processed, but terminated in a root\s*$') { $i } })
              $providerErrorIndices = @(for ($i = 0; $i -lt $verifyLines.Count; $i++) { if ($verifyLines[$i] -match '^\s*certificate which is not trusted by the trust provider\.\s*$') { $i } })
              $signToolErrors = @($verifyLines | Where-Object { $_ -match '^\s*SignTool Error:' })
              $verifiedSummaries = @($verifyLines | Where-Object { $_ -match '^\s*Number of signatures successfully Verified:' })
              $warningSummaries = @($verifyLines | Where-Object { $_ -match '^\s*Number of warnings:' })
              $errorSummaries = @($verifyLines | Where-Object { $_ -match '^\s*Number of errors:' })
              $expectedRootTrustFailure = $verifyExitCode -ne 0 -and
                $signToolErrors.Count -eq 1 -and $rootErrorIndices.Count -eq 1 -and
                $providerErrorIndices.Count -eq 1 -and $providerErrorIndices[0] -eq ($rootErrorIndices[0] + 1) -and
                $verifiedSummaries.Count -eq 1 -and $verifiedSummaries[0] -match '^\s*Number of signatures successfully Verified: 0\s*$' -and
                $warningSummaries.Count -eq 1 -and $warningSummaries[0] -match '^\s*Number of warnings: 0\s*$' -and
                $errorSummaries.Count -eq 1 -and $errorSummaries[0] -match '^\s*Number of errors: 1\s*$'
              if ($verifyExitCode -ne 0 -and -not $expectedRootTrustFailure) { throw "Unexpected MSIX SignTool verification failure" }
              $statusAllowed = $signature.Status -in @("Valid", "NotTrusted") -or ($signature.Status -eq "UnknownError" -and $expectedRootTrustFailure)
              if (-not $statusAllowed) { throw "MSIX signature status was not allowed [$($signature.Status)]" }
            }
            foreach ($build in $builds) {
              Copy-Item $build.Output "$($build.Dir)\rustdesk-web-identity.msix"
              Copy-Item $cerPath "$($build.Dir)\rustdesk-web-identity.cer"
            }
            Set-Content identity-build-complete ok
            $succeeded = $true
          } finally {
            if (-not $succeeded) {
              foreach ($build in $builds) { Remove-Item "$($build.Dir)\rustdesk-web-identity.*" -Force -ErrorAction SilentlyContinue }
            }
            Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $outputRoot -Recurse -Force -ErrorAction SilentlyContinue
            if ($trustedByStep -and $cert) {
              Remove-Item "Cert:\CurrentUser\TrustedPeople\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
              if (-not (Test-Path "Cert:\CurrentUser\TrustedPeople\$($cert.Thumbprint)")) { Remove-Item $certMarker -Force -ErrorAction SilentlyContinue }
            }
            Remove-Item $pfxPath, $cerPath -Force -ErrorAction SilentlyContinue
          }

      - name: Clean sparse MSIX signing material
        if: always() && env.UPLOAD_ARTIFACT == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.cer"
          $certMarker = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.thumbprint"
          $outputRoot = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-output-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stageRoot = Join-Path $env:RUNNER_TEMP "rustdesk-web-identity-stage-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $thumbprint = if (Test-Path $certMarker) { (Get-Content $certMarker -Raw).Trim() } else { $null }
          if ($thumbprint -and (Test-Path "Cert:\CurrentUser\TrustedPeople\$thumbprint")) { Remove-Item "Cert:\CurrentUser\TrustedPeople\$thumbprint" -Force -ErrorAction SilentlyContinue }
          if (-not (Test-Path identity-build-complete)) { Remove-Item rustdesk\rustdesk-web-identity.*, rustdesk-host\rustdesk-web-identity.* -Force -ErrorAction SilentlyContinue }
          Remove-Item $stageRoot, $outputRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $pfxPath, $cerPath -Force -ErrorAction SilentlyContinue
          if (-not $thumbprint -or -not (Test-Path "Cert:\CurrentUser\TrustedPeople\$thumbprint")) { Remove-Item $certMarker -Force -ErrorAction SilentlyContinue }
          if ((Test-Path $pfxPath) -or (Test-Path $stageRoot) -or (Test-Path $outputRoot) -or ($thumbprint -and (Test-Path "Cert:\CurrentUser\TrustedPeople\$thumbprint"))) { Write-Warning "Sparse MSIX signing material cleanup was incomplete" }

      - name: Sign Windows payload with identity certificate
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL == ''
        timeout-minutes: 10
        shell: pwsh
        env:
          WINDOWS_IDENTITY_PFX_BASE64: ${{ secrets.WINDOWS_IDENTITY_PFX_BASE64 }}
          WINDOWS_IDENTITY_PFX_PASSWORD: ${{ secrets.WINDOWS_IDENTITY_PFX_PASSWORD }}
        run: '& .\res\msix\sign_windows_files.ps1 -Paths @("rustdesk", "rustdesk-host")'

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          args=(); [[ -f ../../identity-build-complete ]] || args+=(--exclude rustdesk-web-identity.msix --exclude rustdesk-web-identity.cer)
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe "${args[@]}"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

      - name: Build self-extracted host executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          args=(); [[ -f ../../identity-build-complete ]] || args+=(--exclude rustdesk-web-identity.msix --exclude rustdesk-web-identity.cer)
          python3 ./generate.py -f ../../rustdesk-host/ -o . -e ../../rustdesk-host/rustdesk_host_turtlelab.exe "${args[@]}"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-host-turtlelab-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

      - name: Add MSBuild to PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere not found: $vswhere"
          }
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\\**\\Bin\\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild.exe not found"
          }
          Split-Path $msbuild | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build msi
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $msiRoot = Join-Path $PWD "res/msi"
          $msiBuilds = @(
            @{
              DistDir = "../../rustdesk"
              TempDir = Join-Path $PWD "res/msi-build-rustdesk"
              Output = "rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi"
            },
            @{
              DistDir = "../../rustdesk-host"
              TempDir = Join-Path $PWD "res/msi-build-rustdesk-host"
              Output = "rustdesk-host-turtlelab-${{ env.VERSION }}-${{ matrix.job.arch }}.msi"
            }
          )

          foreach ($build in $msiBuilds) {
            if (Test-Path $build.TempDir) {
              Remove-Item $build.TempDir -Recurse -Force
            }
            Copy-Item $msiRoot $build.TempDir -Recurse
            try {
              Push-Location $build.TempDir

              python preprocess.py --arp -d $build.DistDir
              if ($LASTEXITCODE -ne 0) { throw "preprocess.py failed: $LASTEXITCODE" }

              nuget restore msi.sln
              if ($LASTEXITCODE -ne 0) { throw "nuget restore failed: $LASTEXITCODE" }

              msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
              if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $LASTEXITCODE" }

              Move-Item ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/$($build.Output)
            } finally {
              Pop-Location
              if (Test-Path $build.TempDir) {
                Remove-Item $build.TempDir -Recurse -Force
              }
            }
          }
          Get-ChildItem ./SignOutput/rustdesk-*.msi | Get-FileHash -Algorithm SHA256

      - name: Sign Windows release files with remote service
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != ''
        shell: bash
        run: |
          BASE_URL=${{ secrets.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

      - name: Sign Windows release files with identity certificate
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL == ''
        timeout-minutes: 10
        shell: pwsh
        env:
          WINDOWS_IDENTITY_PFX_BASE64: ${{ secrets.WINDOWS_IDENTITY_PFX_BASE64 }}
          WINDOWS_IDENTITY_PFX_PASSWORD: ${{ secrets.WINDOWS_IDENTITY_PFX_PASSWORD }}
        run: '& .\res\msix\sign_windows_files.ps1 -Paths @("SignOutput") -ReplaceExisting -KeepTrust'

      - name: Verify Windows release signatures
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: pwsh
        env:
          EXPECTED_REMOTE_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_RELEASE_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedNames = @(
            "rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe",
            "rustdesk-host-turtlelab-${{ env.VERSION }}-${{ matrix.job.arch }}.exe",
            "rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi",
            "rustdesk-host-turtlelab-${{ env.VERSION }}-${{ matrix.job.arch }}.msi"
          )
          $prefix = "rustdesk-release-signing-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $expectedSignerMarker = Join-Path $env:RUNNER_TEMP "$prefix.expected-thumbprint"
          $expectedThumbprint = if ($env:SIGN_BASE_URL -eq "") {
            if (-not (Test-Path $expectedSignerMarker)) { throw "Expected fallback signer thumbprint is missing" }
            (Get-Content $expectedSignerMarker -Raw).Trim()
          } else {
            $env:EXPECTED_REMOTE_SIGNER_THUMBPRINT
          }
          if (-not $expectedThumbprint) { throw "Expected Windows release signer thumbprint is not configured" }
          $allowUntrustedRoot = $env:SIGN_BASE_URL -eq ""
          $allowedStatuses = if ($allowUntrustedRoot) { @("Valid", "NotTrusted") } else { @("Valid") }
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName "x64\signtool.exe")) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK SignTool was not found" }
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          foreach ($name in $expectedNames) {
            $file = Get-Item (Join-Path SignOutput $name) -ErrorAction Stop
            $verifyOutput = (& $signtool verify /pa /all /v $file.FullName 2>&1 | Out-String)
            $verifyExitCode = $LASTEXITCODE
            Write-Host $verifyOutput
            $signature = Get-AuthenticodeSignature $file.FullName
            $actualThumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { "none" }
            Write-Host "Release Authenticode status=$($signature.Status) signer=$actualThumbprint"
            if (-not $signature.SignerCertificate) {
              throw "Invalid or missing Authenticode signature: $($file.FullName) [$($signature.Status)]"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) { throw "Unexpected Windows release signer: $($file.FullName)" }
            if ([regex]::Matches($verifyOutput, '(?m)^\s*Signature Index:').Count -ne 1) { throw "Unexpected Windows release signature count: $($file.FullName)" }
            if ($verifyOutput -notmatch '(?m)^\s*The signature is timestamped:' -or $verifyOutput -notmatch '(?m)^\s*Timestamp Verified by:') { throw "Windows release RFC3161 timestamp verification failed: $($file.FullName)" }
            $verifyLines = @($verifyOutput -split '\r?\n')
            $rootErrorIndices = @(for ($i = 0; $i -lt $verifyLines.Count; $i++) { if ($verifyLines[$i] -match '^\s*SignTool Error: A certificate chain processed, but terminated in a root\s*$') { $i } })
            $providerErrorIndices = @(for ($i = 0; $i -lt $verifyLines.Count; $i++) { if ($verifyLines[$i] -match '^\s*certificate which is not trusted by the trust provider\.\s*$') { $i } })
            $signToolErrors = @($verifyLines | Where-Object { $_ -match '^\s*SignTool Error:' })
            $verifiedSummaries = @($verifyLines | Where-Object { $_ -match '^\s*Number of signatures successfully Verified:' })
            $warningSummaries = @($verifyLines | Where-Object { $_ -match '^\s*Number of warnings:' })
            $errorSummaries = @($verifyLines | Where-Object { $_ -match '^\s*Number of errors:' })
            $expectedRootTrustFailure = $verifyExitCode -ne 0 -and
              $signToolErrors.Count -eq 1 -and $rootErrorIndices.Count -eq 1 -and
              $providerErrorIndices.Count -eq 1 -and $providerErrorIndices[0] -eq ($rootErrorIndices[0] + 1) -and
              $verifiedSummaries.Count -eq 1 -and $verifiedSummaries[0] -match '^\s*Number of signatures successfully Verified: 0\s*$' -and
              $warningSummaries.Count -eq 1 -and $warningSummaries[0] -match '^\s*Number of warnings: 0\s*$' -and
              $errorSummaries.Count -eq 1 -and $errorSummaries[0] -match '^\s*Number of errors: 1\s*$'
            if ($verifyExitCode -ne 0 -and (-not $allowUntrustedRoot -or -not $expectedRootTrustFailure)) { throw "Unexpected Windows release SignTool verification failure: $($file.FullName)" }
            $statusAllowed = $signature.Status -in $allowedStatuses -or
              ($allowUntrustedRoot -and $signature.Status -eq "UnknownError" -and $expectedRootTrustFailure)
            if (-not $statusAllowed) { throw "Windows release signature status was not allowed: $($file.FullName) [$($signature.Status)]" }
            Write-Host "Verified $($file.Name): $($signature.SignerCertificate.Subject) [$($signature.Status)]"
          }

      - name: Clean Windows release signing material
        if: always() && env.UPLOAD_ARTIFACT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = "rustdesk-release-signing-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $pfxPath = Join-Path $env:RUNNER_TEMP "$prefix.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "$prefix.cer"
          $certMarker = Join-Path $env:RUNNER_TEMP "$prefix.thumbprint"
          $expectedSignerMarker = Join-Path $env:RUNNER_TEMP "$prefix.expected-thumbprint"
          $sparsePrefix = "rustdesk-web-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sparsePfxPath = Join-Path $env:RUNNER_TEMP "$sparsePrefix.pfx"
          $sparseCerPath = Join-Path $env:RUNNER_TEMP "$sparsePrefix.cer"
          $sparseCertMarker = Join-Path $env:RUNNER_TEMP "$sparsePrefix.thumbprint"
          $thumbprint = if (Test-Path $certMarker) { (Get-Content $certMarker -Raw).Trim() } elseif (Test-Path $sparseCertMarker) { (Get-Content $sparseCertMarker -Raw).Trim() } else { $null }
          if ($thumbprint -and (Test-Path "Cert:\CurrentUser\TrustedPeople\$thumbprint")) { Remove-Item "Cert:\CurrentUser\TrustedPeople\$thumbprint" -Force }
          $temporaryFiles = @($pfxPath, $cerPath, $certMarker, $expectedSignerMarker, $sparsePfxPath, $sparseCerPath, $sparseCertMarker)
          Remove-Item $temporaryFiles -Force -ErrorAction SilentlyContinue
          $residue = @($temporaryFiles | Where-Object { Test-Path $_ })
          if ($residue.Count -ne 0 -or ($thumbprint -and (Test-Path "Cert:\CurrentUser\TrustedPeople\$thumbprint"))) { throw "Windows release signing material cleanup was incomplete" }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
            ./SignOutput/rustdesk-host-turtlelab-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
            ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
            ./SignOutput/rustdesk-host-turtlelab-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
